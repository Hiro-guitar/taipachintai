*{box-sizing:border-box}
body{margin:0;background:#fff}
.menu{width:1250px;height:843px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:421px 1fr;
  gap:3px;background:#1C2426;font-family:"Noto Sans JP",sans-serif;color:#1C2426;overflow:hidden}

/* ---- 主役（上・横長） ---- */
.main{grid-column:1/4;background:#F6D54A;display:flex;align-items:center;justify-content:center;gap:52px;padding:0 56px;position:relative;overflow:hidden}
.main .blob{position:absolute;right:-120px;top:-160px;width:420px;height:420px;border-radius:50%;background:#F9E27E}
.art{width:286px;flex:none;position:relative;z-index:2}
.copy{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:23px;font-weight:700;color:#075A62;letter-spacing:.04em}
.hl{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:67px;line-height:1.2;margin:0;white-space:nowrap}
.hl em{font-style:normal;background:linear-gradient(transparent 60%,#FFFFFF 60%);padding:0 4px}
.tags{display:flex;gap:12px;margin-top:4px}
.tag{background:#fff;border:3px solid #1C2426;border-radius:999px;padding:9px 22px;font-size:24px;font-weight:700;white-space:nowrap}
.tag.free{background:#1C2426;color:#F6D54A}
.tag b{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;color:#0C7F89}

/* ---- 下段 ---- */
.cell{background:#FFFDF7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.ic{width:116px;height:116px;display:block}
.lb{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:42px;line-height:1.2;text-align:center}
.sb{font-size:24px;font-weight:700;color:#075A62;letter-spacing:.02em}
