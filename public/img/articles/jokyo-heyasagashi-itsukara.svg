      <rect x="302" y="258" width="48" height="36" rx="8"/><rect x="368" y="258" width="48" height="36" rx="8"/>
      <rect x="434" y="258" width="48" height="36" rx="8"/><rect x="500" y="258" width="48" height="36" rx="8"/>
      <rect x="170" y="310" width="48" height="36" rx="8"/><rect x="236" y="310" width="48" height="36" rx="8"/>
      <rect x="302" y="310" width="48" height="36" rx="8"/><rect x="434" y="310" width="48" height="36" rx="8"/>
      <rect x="500" y="310" width="48" height="36" rx="8"/>
      <rect x="170" y="362" width="48" height="36" rx="8"/><rect x="236" y="362" width="48" height="36" rx="8"/>
      <rect x="302" y="362" width="48" height="36" rx="8"/><rect x="368" y="362" width="48" height="36" rx="8"/>
