  <circle cx="1080" cy="520" r="140" fill="#F6D54A" opacity=".55"/>
  <circle cx="96" cy="96" r="78" fill="#0C7F89" opacity=".14"/>

  <g stroke="#1C2426" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- 建物 -->
    <g opacity=".9">
      <rect x="830" y="92" width="150" height="214" rx="12" fill="#FFFFFF" stroke-width="7"/>
      <rect x="862" y="128" width="40" height="36" fill="#E0F3F4" stroke-width="5"/>
